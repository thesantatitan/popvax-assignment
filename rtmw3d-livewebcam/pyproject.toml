[project]
name = "rtmw3d-livewebcam-demo"
version = "0.1.0"
description = "Live webcam RTMW3D whole-body pose demo"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "rtmlib==0.0.15",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu==1.26.0; sys_platform == 'linux' and python_version >= '3.11'",
]
tensorrt = [
    "tensorrt-bindings==8.6.1; sys_platform == 'linux' and python_version == '3.11'",
    "tensorrt-libs==8.6.1; sys_platform == 'linux' and python_version == '3.11'",
    "nvidia-cudnn-cu12==8.9.7.29; sys_platform == 'linux' and python_version == '3.11'",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
tensorrt-bindings = { index = "nvidia" }
tensorrt-libs = { index = "nvidia" }
